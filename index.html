<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark to Notion</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 2rem;
      width: 100%;
      max-width: 540px;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 1.5rem;
    }

    /* ---- Form fields ---- */
    .form-group { margin-bottom: 1.1rem; }

    .field-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.35rem;
    }

    label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #444;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .required { color: #e53e3e; }

    .hint {
      font-size: 0.78rem;
      font-weight: 400;
      text-transform: none;
      color: #999;
      letter-spacing: 0;
    }

    input[type="text"],
    input[type="url"] {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 7px;
      padding: 0.6rem 0.75rem;
      font-size: 0.93rem;
      font-family: inherit;
      color: #1a1a1a;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: #fff;
    }
    input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }

    /* ---- Auto-fill badge ---- */
    .autofill-badge {
      font-size: 0.72rem;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      border-radius: 4px;
      padding: 1px 6px;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
    }

    /* ---- Spinner ---- */
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #d1d5db;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner.hidden { display: none; }

    /* ---- Tags ---- */
    .tags-wrapper {
      border: 1px solid #ddd;
      border-radius: 7px;
      padding: 0.5rem 0.6rem 0.4rem;
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
      cursor: text;
    }
    .tags-wrapper:focus-within {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }

    .tag-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.4rem;
    }
    .tag-chips:empty { display: none; }

    /* Existing Notion tags */
    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: opacity 0.1s, border-color 0.1s, filter 0.1s;
      font-family: inherit;
      line-height: 1.4;
      user-select: none;
    }
    .tag-chip:not(.selected) { opacity: 0.55; }
    .tag-chip:hover { opacity: 1; }
    .tag-chip.selected { border-color: currentColor; opacity: 1; filter: saturate(1.2); }
    .tag-chip.selected::before {
      content: '✓';
      font-size: 0.7rem;
      line-height: 1;
    }

    /* Custom (new) tags */
    .tag-chip.custom {
      background: #f3f4f6;
      color: #374151;
      border-color: #9ca3af;
      opacity: 1;
    }
    .tag-remove {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      line-height: 1;
      padding: 0;
      color: inherit;
      opacity: 0.6;
      font-family: inherit;
      margin-left: 1px;
    }
    .tag-remove:hover { opacity: 1; }

    /* New tag input inside the wrapper */
    .tag-input {
      border: none;
      outline: none;
      font-size: 0.83rem;
      font-family: inherit;
      color: #1a1a1a;
      padding: 0.15rem 0.25rem;
      min-width: 140px;
      width: 100%;
      background: transparent;
    }
    .tag-input::placeholder { color: #bbb; }

    /* Tags loading skeleton */
    .tags-loading {
      font-size: 0.82rem;
      color: #bbb;
      padding: 0.15rem 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* ---- Submit row ---- */
    .actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    button[type="submit"] {
      background: #2d2d2d;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.65rem 1.5rem;
      font-size: 0.93rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    button[type="submit"]:hover { background: #444; }
    button[type="submit"]:disabled { background: #aaa; cursor: not-allowed; }

    .ping-link {
      font-size: 0.82rem;
      color: #bbb;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
      text-decoration: underline;
      text-decoration-style: dotted;
    }
    .ping-link:hover { color: #555; }

    /* ---- Status banner ---- */
    #status {
      margin-top: 1.25rem;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.5;
      display: none;
    }
    #status.success { background: #f0fdf4; border: 1px solid #86efac; color: #166534; }
    #status.error   { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }
    #status .status-label { font-weight: 600; margin-bottom: 0.2rem; }
    #status a { color: inherit; font-size: 0.82rem; margin-top: 0.3rem; display: inline-block; }

    .divider { border: none; border-top: 1px solid #eee; margin: 1.5rem 0; }
    .footer-note { font-size: 0.78rem; color: #bbb; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Save Bookmark to Notion</h1>

    <form id="bookmarkForm" onsubmit="saveBookmark(event)" novalidate>

      <!-- URL -->
      <div class="form-group">
        <div class="field-label">
          <label for="url">URL <span class="required">*</span></label>
          <span id="autofillBadge" class="autofill-badge" style="display:none">from clipboard</span>
        </div>
        <input
          type="url"
          id="url"
          name="url"
          placeholder="https://example.com/article"
          autocomplete="off"
        />
      </div>

      <!-- Title -->
      <div class="form-group">
        <div class="field-label">
          <label for="title">Title <span class="required">*</span></label>
          <span id="titleSpinner" class="spinner hidden"></span>
          <span id="titleFetchHint" class="hint" style="display:none">fetching…</span>
        </div>
        <input
          type="text"
          id="title"
          name="title"
          placeholder="Article or page title"
        />
      </div>

      <!-- Tags -->
      <div class="form-group">
        <div class="field-label">
          <label for="tagInput">Tags</label>
          <span class="hint">— click existing or type a new one</span>
        </div>
        <div class="tags-wrapper" onclick="document.getElementById('tagInput').focus()">
          <!-- existing Notion tags as chips -->
          <div id="tagChips" class="tag-chips"></div>
          <!-- newly typed tags not in Notion yet -->
          <div id="customTagChips" class="tag-chips"></div>
          <!-- loading state / input -->
          <div id="tagsLoading" class="tags-loading">
            <span class="spinner"></span> Loading tags…
          </div>
          <input
            type="text"
            id="tagInput"
            class="tag-input"
            placeholder="Type a tag and press Enter…"
            autocomplete="off"
            style="display:none"
          />
        </div>
      </div>

      <div class="actions">
        <button type="submit" id="submitBtn">Save Bookmark</button>
        <button type="button" class="ping-link" onclick="pingNotion()">
          Test connection
        </button>
      </div>
    </form>

    <div id="status"></div>

    <hr class="divider" />
    <p class="footer-note">Saving to: <strong style="color:#999">Things to Read…</strong></p>
  </div>

  <script>
    // ---------------------------------------------------------------------------
    // State
    // ---------------------------------------------------------------------------
    let existingTags   = [];        // { name, color } from Notion
    let selectedTags   = new Set(); // names currently toggled on
    let customTags     = [];        // names typed by user, not in existingTags
    let summaryPromise = null;      // Promise<string> — resolves to AI summary or ''

    // Notion color name → CSS { bg, text } tokens
    const TAG_PALETTE = {
      default: { bg: '#f0f0f0', text: '#555' },
      gray:    { bg: '#f3f4f6', text: '#6b7280' },
      brown:   { bg: '#fdf3ee', text: '#92400e' },
      orange:  { bg: '#fff7ed', text: '#c2410c' },
      yellow:  { bg: '#fefce8', text: '#a16207' },
      green:   { bg: '#f0fdf4', text: '#166534' },
      blue:    { bg: '#eff6ff', text: '#1d4ed8' },
      purple:  { bg: '#faf5ff', text: '#7c3aed' },
      pink:    { bg: '#fdf2f8', text: '#9d174d' },
      red:     { bg: '#fef2f2', text: '#b91c1c' },
    };

    // ---------------------------------------------------------------------------
    // Init
    // ---------------------------------------------------------------------------
    document.addEventListener('DOMContentLoaded', () => {
      loadTags();
      checkClipboard();
      setupTagInput();
      setupUrlBlur();
    });

    // ---------------------------------------------------------------------------
    // Tags
    // ---------------------------------------------------------------------------
    async function loadTags() {
      try {
        const res  = await fetch('/api/get-tags');
        const data = await res.json();
        if (data.success) {
          existingTags = data.tags;
        }
      } catch { /* silently degrade */ }
      finally {
        document.getElementById('tagsLoading').style.display = 'none';
        document.getElementById('tagInput').style.display = 'block';
        renderTagChips();
      }
    }

    function renderTagChips() {
      // Existing Notion tags
      const container = document.getElementById('tagChips');
      container.innerHTML = existingTags.map(tag => {
        const palette = TAG_PALETTE[tag.color] ?? TAG_PALETTE.default;
        const selected = selectedTags.has(tag.name);
        return `<button
          type="button"
          class="tag-chip${selected ? ' selected' : ''}"
          style="background:${palette.bg};color:${palette.text}"
          aria-pressed="${selected}"
          data-name="${escHtml(tag.name)}"
          onclick="toggleTag(this.dataset.name)"
        >${escHtml(tag.name)}</button>`;
      }).join('');

      // Custom (new) tags
      const custom = document.getElementById('customTagChips');
      custom.innerHTML = customTags.map(name =>
        `<span class="tag-chip custom">
          ${escHtml(name)}
          <button type="button" class="tag-remove"
            data-name="${escHtml(name)}"
            onclick="removeCustomTag(this.dataset.name)" title="Remove">×</button>
        </span>`
      ).join('');
    }

    function toggleTag(name) {
      if (selectedTags.has(name)) selectedTags.delete(name);
      else selectedTags.add(name);
      renderTagChips();
    }

    function addCustomTag(raw) {
      const name = raw.trim().replace(/,+$/, '').trim();
      if (!name) return;
      // If it matches an existing tag, just select that chip
      const existing = existingTags.find(
        t => t.name.toLowerCase() === name.toLowerCase()
      );
      if (existing) {
        selectedTags.add(existing.name);
      } else if (!customTags.includes(name)) {
        customTags.push(name);
      }
      renderTagChips();
    }

    function removeCustomTag(name) {
      customTags = customTags.filter(t => t !== name);
      renderTagChips();
    }

    function setupTagInput() {
      const input = document.getElementById('tagInput');
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ',') {
          e.preventDefault();
          addCustomTag(input.value);
          input.value = '';
        } else if (e.key === 'Backspace' && !input.value && customTags.length > 0) {
          removeCustomTag(customTags[customTags.length - 1]);
        }
      });
      // Also handle paste of comma-separated tags
      input.addEventListener('blur', () => {
        if (input.value.trim()) {
          input.value.split(',').forEach(t => addCustomTag(t));
          input.value = '';
        }
      });
    }

    function getTagsString() {
      return [...selectedTags, ...customTags].join(', ');
    }

    // ---------------------------------------------------------------------------
    // Clipboard auto-fill
    // ---------------------------------------------------------------------------
    async function checkClipboard() {
      try {
        const text = (await navigator.clipboard.readText()).trim();
        if (!isValidUrl(text)) return;

        const urlInput = document.getElementById('url');
        // Only auto-fill if the URL field is empty
        if (urlInput.value) return;

        urlInput.value = text;
        document.getElementById('autofillBadge').style.display = 'inline';
        // Fire both in parallel — neither blocks form interaction
        autoFetchTitle(text);
        startSummarize(text);
      } catch {
        // Permission denied or no clipboard access — silently ignore
      }
    }

    // Kick off a background summarise request; store the promise so saveBookmark can await it.
    function startSummarize(url) {
      summaryPromise = fetch(`/api/summarize?url=${encodeURIComponent(url)}`)
        .then(r => r.json())
        .then(d => (d.success ? d.summary : ''))
        .catch(() => '');
    }

    async function autoFetchTitle(url) {
      const titleInput  = document.getElementById('title');
      const spinner     = document.getElementById('titleSpinner');
      const hint        = document.getElementById('titleFetchHint');

      // Only auto-fill title if it's currently empty
      if (titleInput.value) return;

      spinner.classList.remove('hidden');
      hint.style.display = 'inline';

      try {
        const res  = await fetch(`/api/fetch-title?url=${encodeURIComponent(url)}`);
        const data = await res.json();
        if (data.success && data.title && !titleInput.value) {
          titleInput.value = data.title;
        }
      } catch { /* network error — leave title blank */ }
      finally {
        spinner.classList.add('hidden');
        hint.style.display = 'none';
      }
    }

    // Re-fetch title when user leaves the URL field (only if title is still empty);
    // also (re-)start the background summarise whenever the URL changes.
    function setupUrlBlur() {
      document.getElementById('url').addEventListener('blur', e => {
        const url = e.target.value.trim();
        if (url && isValidUrl(url)) {
          autoFetchTitle(url);
          startSummarize(url);
        }
      });
      // Hide "from clipboard" badge if user edits the URL manually
      document.getElementById('url').addEventListener('input', () => {
        document.getElementById('autofillBadge').style.display = 'none';
      });
    }

    // ---------------------------------------------------------------------------
    // Form save
    // ---------------------------------------------------------------------------
    async function saveBookmark(event) {
      event.preventDefault();

      const btn   = document.getElementById('submitBtn');
      const url   = document.getElementById('url').value.trim();
      const title = document.getElementById('title').value.trim();
      const tags  = getTagsString();

      if (!url)   return showStatus('error', 'Missing field', 'URL is required.');
      if (!title) return showStatus('error', 'Missing field', 'Title is required.');

      btn.disabled    = true;
      btn.textContent = 'Saving…';
      document.getElementById('status').style.display = 'none';

      // Collect whatever summary the background fetch has produced.
      // Wait up to 3 s; if it isn't ready (or failed) just proceed without it.
      let summary = '';
      if (summaryPromise) {
        const timeout = new Promise(resolve => setTimeout(() => resolve(''), 3000));
        summary = await Promise.race([summaryPromise, timeout]) ?? '';
      }

      try {
        const res  = await fetch('/api/save-bookmark', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ url, title, tags, summary }),
        });
        const data = await res.json();

        if (data.success) {
          showStatus('success', 'Saved!', data.message, data.pageUrl);
          resetForm();
        } else {
          showStatus('error', 'Save failed', data.message);
        }
      } catch {
        showStatus('error', 'Request failed', 'Could not reach the server. Is it running?');
      }

      btn.disabled    = false;
      btn.textContent = 'Save Bookmark';
    }

    function resetForm() {
      document.getElementById('url').value   = '';
      document.getElementById('title').value = '';
      document.getElementById('autofillBadge').style.display = 'none';
      summaryPromise = null;
      // Reset tag state but keep existingTags loaded
      selectedTags.clear();
      customTags = [];
      renderTagChips();
      // Re-run clipboard check for the next bookmark
      checkClipboard();
    }

    // ---------------------------------------------------------------------------
    // Connection test
    // ---------------------------------------------------------------------------
    async function pingNotion() {
      document.getElementById('status').style.display = 'none';
      try {
        const res  = await fetch('/api/ping-notion');
        const data = await res.json();
        showStatus(data.success ? 'success' : 'error',
          data.success ? 'Connection OK' : 'Connection failed',
          data.message);
      } catch {
        showStatus('error', 'Request failed', 'Could not reach the server.');
      }
    }

    // ---------------------------------------------------------------------------
    // Utilities
    // ---------------------------------------------------------------------------
    function showStatus(type, label, message, link) {
      const el = document.getElementById('status');
      el.className      = type;
      el.style.display  = 'block';
      el.innerHTML = `
        <div class="status-label">${escHtml(label)}</div>
        <div>${escHtml(message)}</div>
        ${link ? `<a href="${escHtml(link)}" target="_blank" rel="noopener">Open in Notion →</a>` : ''}
      `;
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function isValidUrl(text) {
      try {
        const u = new URL(text);
        return u.protocol === 'http:' || u.protocol === 'https:';
      } catch { return false; }
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
